name: nexus_app
description: Nexus - local-first cross-device system (QR pairing module)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0          # generates the QR code shown on-screen
  mobile_scanner: ^5.2.3      # scans a QR code using the camera
  shelf: ^1.4.1                # tiny local HTTP server for the pairing handshake
  http: ^1.2.2                  # sends the handshake request to the other device
  shared_preferences: ^2.3.2   # stores the list of paired devices on-device
  uuid: ^4.5.1                  # generates this device's unique ID
  file_picker: ^12.0.0       # lets the user choose a file to send
  path_provider: ^2.1.6      # finds where to save received files
  path: ^1.9.1               # safe filename/folder path handling
  cryptography: ^2.9.0
  crypto: ^3.0.7
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_tts: ^4.2.5
  android_intent_plus: ^6.1.0
  flutter_timezone: ^5.1.0
  lib_llama_cpp: ^0.7.3
  record: ^7.1.1
  archive: ^4.0.9
  ffi: ^2.2.0
  open_filex: ^4.4.0   # opens received files with the platform's default app
  flutter_contacts: ^2.3.1  # resolves a spoken contact name to a phone number

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0  # recommended lint rules for the analyzer
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
