name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Install Linux desktop build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner can leave a background apt process holding the dpkg
          # lock, which makes apt-get install hang. Stop those services and
          # wait for the lock to clear before installing.
          sudo systemctl stop apt-daily.service apt-daily.timer apt-daily-upgrade.service apt-daily-upgrade.timer 2>/dev/null || true
          sudo killall apt-get apt 2>/dev/null || true
          for i in 1 2 3 4 5 6; do
            if sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
              sleep 10
            else
              break
            fi
          done
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-app-linux
          path: build/linux/x64/release/bundle

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-linux]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-app-debug-apk
          path: artifacts/
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-app-linux
          path: artifacts/linux-bundle/
      - name: Package Linux bundle
        run: |
          cd artifacts/linux-bundle
          tar czf ../nexus-linux-x64.tar.gz .
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ steps.sha.outputs.short }}
          name: 'v0.1.0 (${{ steps.sha.outputs.short }})'
          body: |
            Automated build from commit ${{ github.sha }}.

            **Android:** Download `app-debug.apk` and install.
            **Linux:** Download `nexus-linux-x64.tar.gz`, extract, and follow the update instructions in Settings > Check for updates.
          files: |
            artifacts/app-debug.apk
            artifacts/nexus-linux-x64.tar.gz
          make_latest: false
          draft: false
